name: Server (Windows Debug build)
# Manual only: MSVC does not build the current sources yet (glaze reflection on
# structs in anonymous namespaces). CI builds on Linux in server-linux.yml.
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check GME handler registrations
        shell: pwsh
        run: python scripts/audit_handlers.py
      - name: Install CMake and Rust toolchain
        shell: pwsh
        run: |
          python -m pip install 'cmake>=4.0,<5' ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Configure and build a clean Debug server
        shell: pwsh
        run: |
          ./scripts/Build-Dev.ps1 -BootstrapVcpkg -VcpkgRoot "$env:RUNNER_TEMP\bf-vcpkg" -Jobs 2
      - name: Start Debug server and developer console with a fresh save
        shell: pwsh
        run: python scripts/test_debug_startup.py out/build/debug-win64/standalone_frontend/Debug/gimuserverw.exe
